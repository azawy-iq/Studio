name: AzawyStudio
options:
  bundleIdPrefix: com.azawy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  AzawyStudio:
    type: application
    platform: iOS
    sources:
      - path: AzawyStudio
    resources:
      - path: AzawyStudio/Assets.xcassets
      - path: AzawyStudio/LUTs
    info:
      path: AzawyStudio/Info.plist
      properties:
        CFBundleDisplayName: "Azawy Studio"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "يحتاج التطبيق للوصول لمكتبة الصور لاختيار فيديو ومعالجته."
        NSPhotoLibraryAddUsageDescription: "يحتاج التطبيق لحفظ الفيديو بعد معالجته في مكتبة الصور."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azawy.studio
        PRODUCT_NAME: "Azawy Studio"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
