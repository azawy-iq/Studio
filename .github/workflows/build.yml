name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o AzawyStudio.zip -d extracted_project

      - name: Create Clean Xcode Project & Build IPA
        run: |
          # العثور على مجلد السورس كود
          SRC_DIR=$(find extracted_project -name "AzawyStudioApp.swift" -exec dirname {} \;)
          cd "$SRC_DIR/.."

          # إنشاء ملف project.yml حديث يستهدف iOS 16.0
          cat << 'EOF' > project.yml
          name: AzawyStudio
          options:
            bundlePrefix: com.azawy
            deploymentTarget:
              iOS: "16.0"
          targets:
            AzawyStudio:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - AzawyStudio
              settings:
                GENERATE_INFOPLIST_FILE: YES
                PRODUCT_BUNDLE_IDENTIFIER: com.azawy.AzawyStudio
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                SWIFT_VERSION: "5.0"
          EOF

          # تثبيت XcodeGen وتوليد المشروع
          brew install xcodegen
          xcodegen generate

          # بناء الأرشيف بنسخة iOS 16 بدون الحاجة لتوقيع
          xcodebuild archive \
            -project AzawyStudio.xcodeproj \
            -scheme AzawyStudio \
            -archivePath build/App.xcarchive \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_EFFICIENT_MODE=NO

          # استخراج وتجميع ملف IPA
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r AzawyStudio.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AzawyStudio-IPA
          path: /**/AzawyStudio.ipa
