name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: unzip -o AzawyStudio.zip -d extracted_project

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd extracted_project/AzawyStudio
          xcodegen generate

      - name: Build (unsigned)
        run: |
          cd extracted_project/AzawyStudio
          xcodebuild \
            -project AzawyStudio.xcodeproj \
            -scheme AzawyStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA
        run: |
          cd extracted_project/AzawyStudio
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AzawyStudio.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AzawyStudio-IPA
          path: extracted_project/AzawyStudio/AzawyStudio.ipa
